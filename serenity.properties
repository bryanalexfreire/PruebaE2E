# Browser configuration
webdriver.driver=firefox
webdriver.autodownload=true

# Local driver paths (optional ? used when autodownload is disabled)
webdriver.edge.driver=drivers/edge/147/msedgedriver.exe
webdriver.chrome.driver=drivers/chrome/147/extracted/chromedriver.exe
webdriver.firefox.driver=drivers/firefox/150/extracted/geckodriver.exe

# Browser window settings
serenity.browser.maximize=true
headless.mode=false

# Timeouts (milliseconds)
webdriver.wait.for.timeout=1000
webdriver.timeouts.implicitlywait=26000

# Serenity output and reporting
serenity.outputDirectory=target/site/serenity
serenity.project.requirements.directory=src/test/resources/features
serenity.requirement.types=feature,scenario
serenity.reports.showStepDescriptions=true
serenity.reports.showStepResults=true

# Screenshots
serenity.take.screenshots=FOR_EACH_ACTION
webdriver.screenshot.dir=target/site/serenity/screenshots
webdriver.screenshot.format=png

# Logging
webdriver.log.level=INFO
