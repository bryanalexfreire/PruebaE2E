# Browser configuration
webdriver.driver=firefox
webdriver.autodownload=true


# Browser window settings
serenity.browser.maximize=true
headless.mode=false

# Timeouts (milliseconds): explicit waits only. Implicit wait 0, so every wait states its condition
# (see util/Timeouts); Serenity waits up to wait.for.timeout for an element before typing or reading it.
webdriver.wait.for.timeout=10000
webdriver.timeouts.implicitlywait=0

# Serenity report: the full evidence (steps, Screenplay actions, screenshots, data, page HTML at failures)
serenity.outputDirectory=target/site/serenity
serenity.project.requirements.directory=src/test/resources/features
serenity.requirement.types=feature,scenario
serenity.reports.showStepDescriptions=true
serenity.report.encoding=UTF-8
serenity.consistency.level=RELAXED

# Screenshots: one after each step, full resolution; the page HTML is kept for failing steps.
# Only Serenity takes screenshots, so the Cucumber report holds results and data as text.
serenity.take.screenshots=AFTER_EACH_STEP
serenity.compress.screenshots=false
serenity.store.html=FAILURES

# Browser window used for screenshots
serenity.display.width=1920
serenity.display.height=1080


# Logging
webdriver.log.level=INFO
