name: 🚀 E2E Tests - Serenity BDD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: false
        default: 'firefox'
        type: choice
        options:
          - firefox
          - chrome
          - edge

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.7'

jobs:
  test:
    name: 🧪 E2E Tests - ${{ matrix.browser }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome, edge]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 📋 Verify Java installation
        run: java -version

      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 🔎 Inspect runtime browser configuration
        run: |
          Write-Host "Selected browser: ${{ matrix.browser }}"
          Write-Host "Serenity will resolve the WebDriver dynamically via Selenium Manager."
        shell: powershell

      - name: 🚀 Run E2E Tests
        id: e2e
        run: |
          .\gradlew.bat clean test -Pbrowser=${{ matrix.browser }} --info 2>&1 | Tee-Object test-output.log
        shell: powershell

      - name: 🧾 Record browser status
        if: always()
        run: |
          $browser = "${{ matrix.browser }}"
          $outcome = "${{ steps.e2e.outcome }}"
          $status = if ($outcome -eq "success") { "success" } else { "failure" }

          @(
            "browser=$browser"
            "status=$status"
            "outcome=$outcome"
          ) | Set-Content -Path test-status.txt -Encoding utf8

           Write-Host "Recorded status for ${browser}: $status"
        shell: powershell

      - name: 📊 Generate Serenity Report
        if: always()
        run: |
          $reportPath = "target\site\serenity\index.html"
          if (Test-Path $reportPath) {
            Write-Host "✓ Serenity report generated successfully"
          } else {
            Write-Host "⚠ Serenity report not found"
          }
        shell: powershell

      - name: 📸 Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-${{ matrix.browser }}
          path: target/site/serenity/
          retention-days: 30

      - name: 📦 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            build/reports/tests/
            build/cucumber-reports/
            target/test-results/
          retention-days: 30

      - name: 📎 Upload Browser Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-${{ matrix.browser }}
          path: test-status.txt
          retention-days: 30

      - name: 📝 Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.browser }}
          path: test-output.log
          retention-days: 30

  results:
    name: 📊 Test Results Summary
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📈 Generate summary
        run: |
          echo "## 🚀 E2E Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          status_files=$(find artifacts -name test-status.txt -type f | sort)

          if [ -z "$status_files" ]; then
            echo "⚠ No browser status files were found." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Browser results:" >> $GITHUB_STEP_SUMMARY
            failed_browsers=()
            passed_browsers=()

            while IFS= read -r file; do
              browser=$(grep '^browser=' "$file" | cut -d'=' -f2)
              status=$(grep '^status=' "$file" | cut -d'=' -f2)

              if [ "$status" = "success" ]; then
                passed_browsers+=("$browser")
              else
                failed_browsers+=("$browser")
              fi
            done <<< "$status_files"

            if [ ${#failed_browsers[@]} -gt 0 ]; then
              echo "- ❌ Failed: ${failed_browsers[*]}" >> $GITHUB_STEP_SUMMARY
            fi

            if [ ${#passed_browsers[@]} -gt 0 ]; then
              echo "- ✅ Passed: ${passed_browsers[*]}" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "### Overall status: ❌ Failure" >> $GITHUB_STEP_SUMMARY
            echo "At least one browser job failed. See the uploaded artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Overall status: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "All browser jobs completed successfully." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Serenity Reports (HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Test Results (XML)" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Screenshots (PNG)" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Test Logs" >> $GITHUB_STEP_SUMMARY