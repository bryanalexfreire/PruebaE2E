webdriver {
  capabilities {
    "ms:edgeOptions" {
      args = [
        "inprivate",
        "start-maximized"
      ]
    }

    "goog:chromeOptions" {
      args = [
        "--incognito",
        "--start-maximized"
      ]
    }

    "moz:firefoxOptions" {
      args = [
        "-private",
        "--width=1920",
        "--height=1080"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
}

serenity {
  requirements {
    root = "src/test/resources/features"
  }
}
