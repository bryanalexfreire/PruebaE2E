webdriver {
  capabilities {
    "ms:edgeOptions" {
      args = [
        "inprivate",
        "start-maximized"
      ]
    }

    "goog:chromeOptions" {
      args = [
        "--incognito",
        "--start-maximized"
      ]
    }

    "moz:firefoxOptions" {
      args = [
        "-private",
        "--width=1920",
        "--height=1080"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
}

serenity {
  requirements {
    root = "src/test/resources/features"
  }

  # Screenshot configuration - ENHANCED
  take.screenshots = "FOR_EACH_ACTION"
  screenshots.take.failure = true
  screenshots.take.success = true
  screenshots.height = 1024
  compress.screenshots = true

  # Report configuration - ENHANCED FOR EVIDENCE
  report.should.include.source = true
  consistency.level = "RELAXED"
  report.encoding = "UTF-8"

  # Browser configuration
  display.width = 1920
  display.height = 1080

  # Logging
  logging.level = "INFO"

  # Feature tags for better organization
  test.root = "target/test-results"
  report.root = "target/site/serenity"
}

# Custom report settings
report {
  title = "Demoblaze E2E Test Report"
  project = "PruebaE2E"
  show.pie.charts = true
  show.step.details = true
  show.test.duration = true
}



